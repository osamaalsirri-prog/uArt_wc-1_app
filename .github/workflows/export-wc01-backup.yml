name: Export WC01 source backup
on:
  push:
    branches: [backup-wc01-2026-11-26]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Archive exact release sources and prepare both editions
        run: |
          mkdir -p export
          git archive --format=zip --prefix=WC01-Android-source/ -o export/Android_repository_9b24ca7.zip 9b24ca70d2d659821bcf4130a8ed286b644e1a04
          git log 9b24ca70d2d659821bcf4130a8ed286b644e1a04 --format=fuller > export/Android_git_history.txt
          git bundle create export/Android_release_history.bundle HEAD
          for edition in customer engineering; do
            mkdir -p "prepared-$edition"
            unzip -q uArt_WC01_Android_Source.zip -d "prepared-$edition"
            node lab/prepare.mjs "prepared-$edition/android" "$edition"
            node --check "prepared-$edition/android/app/src/main/assets/js/app.js"
            (cd "prepared-$edition" && zip -qr "../export/Android_${edition}_V1.1.9_source.zip" android)
          done
          node lab/test.mjs > export/Android_source_tests.txt
          (cd export && sha256sum * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: WC01-Android-source-backup
          path: export/
          if-no-files-found: error
      - name: Obtain reference TFT_eSPI source
        continue-on-error: true
        run: |
          mkdir -p libraries
          git clone --depth 1 https://github.com/Bodmer/TFT_eSPI.git libraries/TFT_eSPI
          git -C libraries/TFT_eSPI rev-parse HEAD > libraries/TFT_eSPI_commit.txt
          rm -rf libraries/TFT_eSPI/.git
          echo 'Reference version only; actual installed version must be verified on the owner PC.' > libraries/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: WC01-reference-TFT-library
          path: libraries/
          if-no-files-found: warn
