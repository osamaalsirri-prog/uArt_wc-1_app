name: Build uArt WC-01 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout files
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use Android SDK already installed on GitHub runner
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
          test -f "${ANDROID_HOME}/platforms/android-35/android.jar"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack original Android app
        run: |
          unzip -q uArt_WC01_Android_Source.zip -d android-source
          test -f android-source/android/settings.gradle.kts
          test -f android-source/android/app/build.gradle.kts

      - name: Build APK
        working-directory: android-source/android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: uArt-WC01-v6-debug-APK
          path: android-source/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
