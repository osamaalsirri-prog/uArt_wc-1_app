name: Dual edition preview
on:
  push:
    branches: ['preview/dual-edition-v6.2']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [customer, engineering]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configure Android SDK
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager unavailable on hosted runner"
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
      - name: Generate and check preview sources
        run: python3 tools/build_editions.py uArt_WC01_Android_Source.zip editions
      - name: Compile Android APK
        working-directory: editions/${{ matrix.edition }}/android
        run: gradle --no-daemon assembleDebug
      - name: Upload APK and source
        uses: actions/upload-artifact@v4
        with:
          name: uArt-${{ matrix.edition }}-6.2-preview
          path: editions/${{ matrix.edition }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: uArt-${{ matrix.edition }}-6.2-preview-source
          path: |
            editions/${{ matrix.edition }}/
            !editions/${{ matrix.edition }}/android/**/build/
            !editions/${{ matrix.edition }}/android/.gradle/
          if-no-files-found: error
